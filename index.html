<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کرونوس (Chrono) | مدیریت زمان</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300d285' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='M12 6v6l4 2'/></svg>">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Vazirmatn Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg-main': '#0f1318',
                        'bg-soft': '#161b22',
                        'panel': '#1c2128',
                        'border-main': '#2a323d',
                        'emerald-glow': '#00d285',
                    },
                    fontFamily: {
                        'vazir': ['Vazirmatn', 'sans-serif'],
                    },
                    boxShadow: {
                        'glow': '0 0 16px rgba(0, 210, 133, 0.35)',
                        'glow-strong': '0 0 24px rgba(0, 210, 133, 0.6)',
                    },
                    animation: {
                        'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        'pulse-glow': {
                            '0%, 100%': { boxShadow: '0 0 16px rgba(0, 210, 133, 0.35)' },
                            '50%': { boxShadow: '0 0 24px rgba(0, 210, 133, 0.7)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0f1318;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 210, 133, 0.05) 0%, transparent 50%);
        }
        
        input, textarea, button {
            font-family: 'Vazirmatn', sans-serif !important;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #161b22; }
        ::-webkit-scrollbar-thumb { background: #2a323d; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #00d285; }

        .modal-overlay {
            background: rgba(15, 19, 24, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .session-row {
            height: 3.5rem; /* 56px uniform height */
            display: flex;
            align-items: center;
        }

        @media print {
            body * { visibility: hidden; }
            #reports-view, #reports-view * { visibility: visible; }
            #reports-view { position: absolute; right: 0; top: 0; width: 100%; background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-card { border: 1px solid #ccc !important; box-shadow: none !important; background: white !important; color: black !important; }
            .print-text { color: black !important; }
            .print-emerald { color: #10b981 !important; }
        }
    </style>
</head>
<body class="text-white h-screen flex flex-col">

    <!-- Main Container -->
    <div class="w-full max-w-[1144px] mx-auto px-2 sm:px-4 py-4 flex-1 flex flex-col min-h-0 overflow-hidden">
        
        <!-- Top Bar -->
        <header class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-4 flex-shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-glow/10 border border-emerald-glow/30 flex items-center justify-center shadow-glow">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-glow" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h1 class="text-xl sm:text-2xl font-black tracking-tight">کرونوس <span class="text-emerald-glow text-xs sm:text-sm font-normal">(Chrono)</span></h1>
            </div>
            
            <!-- Action Group: Toggle Button + Tabs -->
            <div class="flex items-center gap-2 sm:gap-4">
                <button id="toggle-session-btn" class="px-5 py-2.5 rounded-full bg-emerald-glow text-bg-main font-bold text-xs sm:text-sm shadow-glow transition-all duration-300 hover:scale-105 active:scale-95 flex items-center gap-2 z-10">
                    <span id="toggle-btn-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z" />
                        </svg>
                    </span>
                    <span id="toggle-btn-text">شروع نوبت</span>
                </button>

                <nav class="flex gap-2 bg-panel border border-border-main rounded-full p-1.5">
                    <button id="tab-tracker" class="tab-btn px-4 sm:px-6 py-2 sm:py-2.5 rounded-full font-bold text-xs sm:text-sm transition-all duration-300 bg-emerald-glow/15 text-emerald-glow">
                        ثبت زمان
                    </button>
                    <button id="tab-reports" class="tab-btn px-4 sm:px-6 py-2 sm:py-2.5 rounded-full font-bold text-xs sm:text-sm transition-all duration-300 text-gray-400 hover:text-white">
                        گزارش‌ها
                    </button>
                </nav>
            </div>
        </header>

        <!-- Tracker View -->
        <main id="tracker-view" class="flex-1 flex flex-col min-h-0">
            <div class="bg-panel border border-border-main rounded-[20px] shadow-2xl flex flex-col flex-1 min-h-0 overflow-hidden">
                <div class="px-2 sm:px-6 py-3 border-b border-border-main bg-bg-soft/50 flex-shrink-0">
                    <div class="grid grid-cols-12 gap-2 text-xs sm:text-sm text-gray-500 font-medium">
                        <div class="col-span-2">تاریخ</div>
                        <div class="col-span-5">تسک‌ها / توضیحات</div>
                        <div class="col-span-2">شروع</div>
                        <div class="col-span-2">پایان (مدت)</div>
                        <div class="col-span-1 text-left pl-2">عملیات</div>
                    </div>
                </div>
                <div id="session-list" class="flex-1 overflow-y-auto min-h-0"></div>
            </div>
        </main>

        <!-- Reports View -->
        <main id="reports-view" class="hidden flex-1 flex-col min-h-0 overflow-y-auto pr-1 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 flex-shrink-0">
                <div class="print-card bg-panel border border-border-main rounded-[20px] p-4 sm:p-6 shadow-xl">
                    <p class="text-gray-400 text-xs sm:text-sm mb-2">کل ساعت‌ها</p>
                    <h3 id="total-hours" class="text-2xl sm:text-3xl font-black text-emerald-glow">۰۰:۰۰</h3>
                </div>
                <div class="print-card bg-panel border border-border-main rounded-[20px] p-4 sm:p-6 shadow-xl">
                    <p class="text-gray-400 text-xs sm:text-sm mb-2">میانگین روزانه</p>
                    <h3 id="daily-avg" class="text-2xl sm:text-3xl font-black text-white">۰۰:۰۰</h3>
                </div>
                <div class="print-card bg-panel border border-border-main rounded-[20px] p-4 sm:p-6 shadow-xl">
                    <p class="text-gray-400 text-xs sm:text-sm mb-2">تعداد تسک‌ها</p>
                    <h3 id="task-count" class="text-2xl sm:text-3xl font-black text-white">۰ تسک</h3>
                </div>
            </div>

            <div class="print-card bg-panel border border-border-main rounded-[20px] p-4 sm:p-8 shadow-xl flex-shrink-0">
                <div class="flex flex-col md:flex-row justify-between items-start mb-8 gap-4 no-print">
                    <h3 class="text-lg sm:text-xl font-bold">توزیع زمان</h3>
                    <div class="flex flex-wrap gap-2">
                        <button id="export-json" class="px-3 sm:px-4 py-2 sm:py-2.5 rounded-xl bg-bg-soft border border-border-main text-gray-300 hover:border-emerald-glow hover:text-emerald-glow transition-all text-[10px] sm:text-xs font-medium">پشتیبان‌گیری (JSON)</button>
                        <button id="import-json-btn" class="px-3 sm:px-4 py-2 sm:py-2.5 rounded-xl bg-bg-soft border border-border-main text-gray-300 hover:border-emerald-glow hover:text-emerald-glow transition-all text-[10px] sm:text-xs font-medium">بازیابی (JSON)</button>
                        <input type="file" id="import-json-input" accept=".json" class="hidden">
                        <button id="export-csv" class="px-3 sm:px-4 py-2 sm:py-2.5 rounded-xl bg-bg-soft border border-border-main text-gray-300 hover:border-emerald-glow hover:text-emerald-glow transition-all text-[10px] sm:text-xs font-medium">خروجی CSV</button>
                        <button id="export-pdf" class="px-3 sm:px-4 py-2 sm:py-2.5 rounded-xl bg-bg-soft border border-border-main text-gray-300 hover:border-emerald-glow hover:text-emerald-glow transition-all text-[10px] sm:text-xs font-medium">خروجی PDF</button>
                    </div>
                </div>
                <div class="flex flex-col md:flex-row items-center gap-8 sm:gap-12">
                    <div class="relative w-40 h-40 sm:w-64 sm:h-64 no-print">
                        <svg id="donut-chart" viewBox="0 0 200 200" class="w-full h-full transform -rotate-90">
                            <circle cx="100" cy="100" r="80" fill="none" stroke="#2a323d" stroke-width="20"></circle>
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center">
                            <span class="text-xl sm:text-4xl font-black" id="chart-center-text">۰۰:۰۰</span>
                            <span class="text-[10px] sm:text-xs text-gray-400 mt-1">کل زمان</span>
                        </div>
                    </div>
                    <div id="chart-legend" class="flex-1 space-y-3 w-full"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="modal-root"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const STORAGE_KEY = 'chronos_db_v4';
            let state = { activeSession: null, sessions: [] };

            const loadState = () => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) state = JSON.parse(saved);
            };

            const saveState = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

            const toFa = (str) => str === null || str === undefined ? '' : str.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
            const toEn = (str) => !str ? '' : str.toString().replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));

            const formatSolarDate = (ts) => {
                try { return new Intl.DateTimeFormat('fa-IR-u-ca-persian', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ts)).replace(/-/g, '/'); } 
                catch (e) { return toFa(new Date(ts).toLocaleDateString('fa-IR')); }
            };

            const formatTime = (ts) => toFa(new Intl.DateTimeFormat('fa-IR', { hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(ts)));

            const formatDuration = (ms) => {
                if (ms < 0) ms = 0;
                let totalMinutes = Math.floor(ms / 60000);
                const h = Math.floor(totalMinutes / 60);
                const m = totalMinutes % 60;
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            };

            function jalaaliToGregorian(jy, jm, jd) {
                jy = Number(toEn(jy)); jm = Number(toEn(jm)); jd = Number(toEn(jd));
                let gy = (jy <= 979) ? 621 : 1600;
                jy -= (jy <= 979) ? 0 : 979;
                let days = (365 * jy) + (Math.floor(jy / 33) * 8) + Math.floor((jy % 33 + 3) / 4) + 78 + jd + ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
                gy += 400 * Math.floor(days / 146097);
                days %= 146097;
                if (days > 36524) { gy += 100 * Math.floor(--days / 36524); days %= 36524; if (days >= 365) days++; }
                gy += 4 * Math.floor(days / 1461); days %= 1461;
                if (days > 365) { gy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
                let gd = days + 1;
                let sal_a = [0, 31, ((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0)) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
                let gm = 0;
                for (gm = 0; gm < 13 && gd > sal_a[gm]; gm++) gd -= sal_a[gm];
                return new Date(gy, gm - 1, gd);
            }

            document.addEventListener('input', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                    const start = e.target.selectionStart;
                    const end = e.target.selectionEnd;
                    const originalVal = e.target.value;
                    const newVal = toFa(originalVal);
                    if (originalVal !== newVal) {
                        e.target.value = newVal;
                        e.target.setSelectionRange(start, end);
                    }
                }
            });

            const modalRoot = document.getElementById('modal-root');
            let activeModal = null;

            const openModal = (contentHtml, onMount) => {
                closeModal();
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4';
                overlay.innerHTML = `<div class="bg-panel border-2 border-emerald-glow/40 rounded-[20px] p-6 sm:p-8 w-full max-w-lg shadow-glow-strong relative">${contentHtml}</div>`;
                modalRoot.appendChild(overlay);
                activeModal = overlay;
                if (onMount) onMount(overlay);
            };

            const closeModal = () => {
                if (activeModal) { activeModal.remove(); activeModal = null; }
            };

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && activeModal) closeModal();
            });

            const tabTracker = document.getElementById('tab-tracker');
            const tabReports = document.getElementById('tab-reports');
            const trackerView = document.getElementById('tracker-view');
            const reportsView = document.getElementById('reports-view');
            const sessionList = document.getElementById('session-list');
            const toggleBtn = document.getElementById('toggle-session-btn');
            const toggleBtnText = document.getElementById('toggle-btn-text');
            const toggleBtnIcon = document.getElementById('toggle-btn-icon');

            const switchView = (view) => {
                if (view === 'reports') {
                    trackerView.classList.add('hidden'); trackerView.classList.remove('flex');
                    reportsView.classList.remove('hidden'); reportsView.classList.add('flex');
                    tabTracker.classList.remove('bg-emerald-glow/15', 'text-emerald-glow'); tabTracker.classList.add('text-gray-400');
                    tabReports.classList.add('bg-emerald-glow/15', 'text-emerald-glow'); tabReports.classList.remove('text-gray-400');
                    renderReports();
                } else {
                    reportsView.classList.add('hidden'); reportsView.classList.remove('flex');
                    trackerView.classList.remove('hidden'); trackerView.classList.add('flex');
                    tabReports.classList.remove('bg-emerald-glow/15', 'text-emerald-glow'); tabReports.classList.add('text-gray-400');
                    tabTracker.classList.add('bg-emerald-glow/15', 'text-emerald-glow'); tabTracker.classList.remove('text-gray-400');
                    renderTracker();
                }
            };

            tabTracker.addEventListener('click', () => switchView('tracker'));
            tabReports.addEventListener('click', () => switchView('reports'));

            const renderTracker = () => {
                sessionList.innerHTML = '';
                if (state.activeSession) sessionList.appendChild(createRowElement(state.activeSession, true));

                if (state.sessions.length === 0 && !state.activeSession) {
                    sessionList.innerHTML = `<div class="text-center text-gray-500 py-20 text-sm">هنوز نوبت کاری ثبت نشده است.</div>`;
                } else {
                    [...state.sessions].reverse().forEach(s => sessionList.appendChild(createRowElement(s, false)));
                }
                updateToggleButton();
            };

            const createRowElement = (session, isActive) => {
                const row = document.createElement('div');
                row.className = `session-row grid grid-cols-12 gap-2 px-2 sm:px-6 border-b border-border-main/50 transition-all text-xs sm:text-sm ${isActive ? 'bg-emerald-glow/5' : 'hover:bg-bg-soft'}`;
                
                const dateCol = `<div class="col-span-2 text-gray-300 font-medium truncate">${formatSolarDate(session.startTime)}</div>`;
                const taskCol = `<div class="col-span-5 text-white truncate">${session.task || 'بدون توضیحات'}</div>`;
                const startCol = `<div class="col-span-2 text-gray-400">${formatTime(session.startTime)}</div>`;
                
                let endCol;
                if (isActive) {
                    endCol = `<div class="col-span-2"><span class="px-2 py-1 rounded-full bg-emerald-glow/15 text-emerald-glow text-[10px] sm:text-xs font-bold animate-pulse">در حال اجرا</span></div>`;
                } else {
                    const dur = formatDuration(session.endTime - session.startTime);
                    endCol = `<div class="col-span-2 text-gray-400 flex flex-col"><span>${formatTime(session.endTime)}</span><span class="text-[9px] sm:text-[10px] text-gray-500">(${toFa(dur)})</span></div>`;
                }

                let actionCol = `<div class="col-span-1 text-left pl-1"></div>`;
                if (!isActive) {
                    actionCol = `
                        <div class="col-span-1 text-left pl-1 relative">
                            <button class="action-menu-btn p-1 rounded-lg hover:bg-border-main text-gray-400 hover:text-white" data-id="${session.id}">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" /></svg>
                            </button>
                            <div class="dropdown-menu absolute left-0 mt-1 w-28 bg-panel border border-border-main rounded-xl shadow-xl py-2 hidden z-20 text-right">
                                <button class="edit-btn block w-full px-4 py-2 text-xs text-gray-300 hover:bg-bg-soft hover:text-emerald-glow" data-id="${session.id}">ویرایش</button>
                                <button class="delete-btn block w-full px-4 py-2 text-xs text-gray-300 hover:bg-bg-soft hover:text-red-500" data-id="${session.id}">حذف</button>
                            </div>
                        </div>`;
                }

                row.innerHTML = `${dateCol}${taskCol}${startCol}${endCol}${actionCol}`;
                return row;
            };

            sessionList.addEventListener('click', (e) => {
                const menuBtn = e.target.closest('.action-menu-btn');
                const editBtn = e.target.closest('.edit-btn');
                const deleteBtn = e.target.closest('.delete-btn');

                if (menuBtn) {
                    document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.add('hidden'));
                    menuBtn.nextElementSibling.classList.toggle('hidden');
                    e.stopPropagation();
                } else if (editBtn) {
                    openEditModal(Number(editBtn.dataset.id));
                } else if (deleteBtn) {
                    openDeleteModal(Number(deleteBtn.dataset.id));
                } else {
                    document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.add('hidden'));
                }
            });

            const updateToggleButton = () => {
                if (state.activeSession) {
                    toggleBtnText.textContent = 'پایان نوبت';
                    toggleBtnIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.5 7.5a3 3 0 013-3h9a3 3 0 013 3v9a3 3 0 01-3 3h-9a3 3 0 01-3-3v-9z" clip-rule="evenodd" /></svg>`;
                    toggleBtn.classList.add('animate-pulse-glow', 'shadow-glow-strong');
                    toggleBtn.classList.remove('shadow-glow');
                } else {
                    toggleBtnText.textContent = 'شروع نوبت';
                    toggleBtnIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z" /></svg>`;
                    toggleBtn.classList.remove('animate-pulse-glow', 'shadow-glow-strong');
                    toggleBtn.classList.add('shadow-glow');
                }
            };

            toggleBtn.addEventListener('click', () => {
                if (state.activeSession) {
                    state.activeSession.endTime = Date.now();
                    state.sessions.push(state.activeSession);
                    state.activeSession = null;
                    saveState();
                    renderTracker();
                } else {
                    openTaskModal();
                }
            });

            const openTaskModal = () => {
                const html = `
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg sm:text-xl font-bold text-white">افزودن تسک / توضیحات</h2>
                        <button class="modal-close-x text-gray-400 hover:text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                    </div>
                    <textarea id="task-input" rows="5" class="w-full bg-bg-soft border border-border-main rounded-xl p-4 text-white resize-none focus:outline-none focus:border-emerald-glow transition-colors mb-6 text-sm" placeholder="تسک‌های این نوبت کاری را وارد کنید..."></textarea>
                    <div class="flex gap-4">
                        <button id="modal-confirm" class="flex-1 py-3 rounded-xl bg-emerald-glow text-bg-main font-bold transition-all hover:opacity-90 active:scale-95 text-sm">تایید و شروع</button>
                        <button class="modal-cancel flex-1 py-3 rounded-xl bg-bg-soft border border-border-main text-gray-300 font-medium transition-all hover:bg-border-main active:scale-95 text-sm">انصراف</button>
                    </div>
                `;
                openModal(html, (modal) => {
                    const taskInput = modal.querySelector('#task-input');
                    modal.querySelector('.modal-close-x').onclick = closeModal;
                    modal.querySelector('.modal-cancel').onclick = closeModal;
                    taskInput.focus();

                    taskInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            confirmTask();
                        }
                    });

                    modal.querySelector('#modal-confirm').onclick = confirmTask;
                    function confirmTask() {
                        state.activeSession = { id: Date.now(), startTime: Date.now(), task: taskInput.value.trim() };
                        saveState(); closeModal(); renderTracker();
                    }
                });
            };

            const openEditModal = (id) => {
                const session = state.sessions.find(s => s.id === id);
                if (!session) return;

                const startDate = new Date(session.startTime);
                const endDate = new Date(session.endTime);
                
                const parts = new Intl.DateTimeFormat('en-u-ca-persian', { year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(startDate);
                let jy = '', jm = '', jd = '';
                parts.forEach(p => {
                    if (p.type === 'year') jy = p.value;
                    if (p.type === 'month') jm = p.value;
                    if (p.type === 'day') jd = p.value;
                });
                const editDateStr = toFa(`${jy}/${jm}/${jd}`);
                
                const editStartStr = toFa(`${String(startDate.getHours()).padStart(2, '0')}:${String(startDate.getMinutes()).padStart(2, '0')}`);
                const editEndStr = toFa(`${String(endDate.getHours()).padStart(2, '0')}:${String(endDate.getMinutes()).padStart(2, '0')}`);

                const html = `
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg sm:text-xl font-bold text-white">ویرایش نوبت کاری</h2>
                        <button class="modal-close-x text-gray-400 hover:text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                    </div>
                    <div class="space-y-4 mb-6 text-sm">
                        <div>
                            <label class="block text-xs text-gray-400 mb-2">تاریخ (YYYY/MM/DD)</label>
                            <input type="text" id="edit-date" value="${editDateStr}" class="w-full bg-bg-soft border border-border-main rounded-xl p-3 text-white focus:outline-none focus:border-emerald-glow" placeholder="۱۴۰۳/۰۱/۱۵">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs text-gray-400 mb-2">ساعت شروع (HH:MM)</label>
                                <input type="text" id="edit-start" value="${editStartStr}" class="w-full bg-bg-soft border border-border-main rounded-xl p-3 text-white focus:outline-none focus:border-emerald-glow" placeholder="۱۴:۳۰">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 mb-2">ساعت پایان (HH:MM)</label>
                                <input type="text" id="edit-end" value="${editEndStr}" class="w-full bg-bg-soft border border-border-main rounded-xl p-3 text-white focus:outline-none focus:border-emerald-glow" placeholder="۱۶:۴۵">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-2">تسک‌ها / توضیحات</label>
                            <textarea id="edit-task" rows="4" class="w-full bg-bg-soft border border-border-main rounded-xl p-3 text-white resize-none focus:outline-none focus:border-emerald-glow">${session.task || ''}</textarea>
                        </div>
                    </div>
                    <div class="flex gap-4">
                        <button id="modal-save" class="flex-1 py-3 rounded-xl bg-emerald-glow text-bg-main font-bold transition-all hover:opacity-90 active:scale-95 text-sm">ذخیره تغییرات</button>
                        <button class="modal-cancel flex-1 py-3 rounded-xl bg-bg-soft border border-border-main text-gray-300 font-medium transition-all hover:bg-border-main active:scale-95 text-sm">انصراف</button>
                    </div>
                `;

                openModal(html, (modal) => {
                    modal.querySelector('.modal-close-x').onclick = closeModal;
                    modal.querySelector('.modal-cancel').onclick = closeModal;
                    modal.querySelector('#modal-save').onclick = () => {
                        try {
                            const dateParts = toEn(modal.querySelector('#edit-date').value.trim()).split('/').map(Number);
                            if (dateParts.length !== 3) throw new Error("تاریخ نامعتبر است");
                            const gregorianDate = jalaaliToGregorian(dateParts[0], dateParts[1], dateParts[2]);
                            const year = gregorianDate.getFullYear();
                            const month = gregorianDate.getMonth();
                            const day = gregorianDate.getDate();

                            const startParts = toEn(modal.querySelector('#edit-start').value.trim()).split(':').map(Number);
                            const endParts = toEn(modal.querySelector('#edit-end').value.trim()).split(':').map(Number);

                            const newStart = new Date(year, month, day, startParts[0] || 0, startParts[1] || 0).getTime();
                            const newEnd = new Date(year, month, day, endParts[0] || 0, endParts[1] || 0).getTime();

                            if (newEnd <= newStart) throw new Error("زمان پایان باید بعد از شروع باشد");

                            session.startTime = newStart;
                            session.endTime = newEnd;
                            session.task = modal.querySelector('#edit-task').value.trim();
                            saveState(); closeModal(); renderTracker();
                        } catch (err) {
                            alert("خطا در ذخیره سازی: " + err.message);
                        }
                    };
                });
            };

            const openDeleteModal = (id) => {
                const html = `
                    <div class="text-center">
                        <div class="mx-auto flex items-center justify-center h-14 w-14 sm:h-16 sm:w-16 rounded-full bg-red-500/10 border border-red-500/30 mb-6">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 sm:h-8 sm:w-8 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </div>
                        <h2 class="text-lg sm:text-xl font-bold text-white mb-2">حذف نوبت کاری</h2>
                        <p class="text-gray-400 mb-8 text-sm">آیا از حذف این تسک مطمئن هستید؟ این عملیات غیرقابل بازگشت است.</p>
                        <div class="flex gap-4">
                            <button id="modal-delete" class="flex-1 py-3 rounded-xl bg-red-500 text-white font-bold transition-all hover:opacity-90 active:scale-95 text-sm">بله، حذف شود</button>
                            <button class="modal-cancel flex-1 py-3 rounded-xl bg-bg-soft border border-border-main text-gray-300 font-medium transition-all hover:bg-border-main active:scale-95 text-sm">انصراف</button>
                        </div>
                    </div>
                `;
                openModal(html, (modal) => {
                    modal.querySelector('.modal-cancel').onclick = closeModal;
                    modal.querySelector('#modal-delete').onclick = () => {
                        state.sessions = state.sessions.filter(s => s.id !== id);
                        saveState(); closeModal(); renderTracker();
                    };
                });
            };

            const renderReports = () => {
                const allSessions = [...state.sessions];
                if (state.activeSession) allSessions.push(state.activeSession);

                let totalMs = 0;
                const dailyData = {};
                const taskData = {};

                allSessions.forEach(s => {
                    const end = s.endTime || Date.now();
                    const durMs = end - s.startTime;
                    totalMs += durMs;
                    const day = formatSolarDate(s.startTime);
                    dailyData[day] = (dailyData[day] || 0) + durMs;
                    const taskName = s.task?.split('\n')[0]?.substring(0, 20) || 'بدون عنوان';
                    taskData[taskName] = (taskData[taskName] || 0) + durMs;
                });

                document.getElementById('total-hours').textContent = toFa(formatDuration(totalMs));
                const uniqueDays = Object.keys(dailyData).length;
                const avgMs = uniqueDays > 0 ? (totalMs / uniqueDays) : 0;
                document.getElementById('daily-avg').textContent = toFa(formatDuration(avgMs));
                document.getElementById('task-count').textContent = `${toFa(allSessions.length)} تسک`;
                document.getElementById('chart-center-text').textContent = toFa(formatDuration(totalMs));

                renderDonutChart(taskData, totalMs);
            };

            const renderDonutChart = (data, totalMs) => {
                const svg = document.getElementById('donut-chart');
                const legend = document.getElementById('chart-legend');
                while (svg.childNodes.length > 1) svg.removeChild(svg.lastChild);
                legend.innerHTML = '';

                if (totalMs === 0) {
                    legend.innerHTML = '<div class="text-gray-500 text-sm">داده‌ای برای نمایش وجود ندارد.</div>';
                    return;
                }

                const colors = ['#00d285', '#10b981', '#34d399', '#6ee7b7', '#a7f3d0', '#d1fae5'];
                let cumulativePercentage = 0;
                let colorIndex = 0;

                Object.entries(data).forEach(([name, ms]) => {
                    const percentage = ms / totalMs;
                    const dashArray = `${percentage * 502.4} 502.4`; 
                    const dashOffset = -cumulativePercentage * 502.4;
                    
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', '100'); circle.setAttribute('cy', '100'); circle.setAttribute('r', '80');
                    circle.setAttribute('fill', 'none'); circle.setAttribute('stroke', colors[colorIndex % colors.length]);
                    circle.setAttribute('stroke-width', '20'); circle.setAttribute('stroke-dasharray', dashArray);
                    circle.setAttribute('stroke-dashoffset', dashOffset);
                    svg.appendChild(circle);

                    const legendItem = document.createElement('div');
                    legendItem.className = 'flex items-center justify-between p-2 sm:p-3 rounded-lg bg-bg-soft/50 border border-border-main text-xs sm:text-sm';
                    legendItem.innerHTML = `
                        <div class="flex items-center gap-2 sm:gap-3">
                            <span class="w-3 h-3 rounded-full" style="background-color: ${colors[colorIndex % colors.length]}"></span>
                            <span class="text-white">${name}</span>
                        </div>
                        <span class="text-gray-400">${toFa(formatDuration(ms))} (${toFa((percentage * 100).toFixed(0))}٪)</span>
                    `;
                    legend.appendChild(legendItem);
                    cumulativePercentage += percentage;
                    colorIndex++;
                });
            };

            document.getElementById('export-csv').addEventListener('click', () => {
                let csv = '\uFEFFتاریخ,تسک,ساعت شروع,ساعت پایان,مدت زمان\n';
                state.sessions.forEach(s => {
                    const dur = formatDuration(s.endTime - s.startTime);
                    const date = formatSolarDate(s.startTime);
                    const start = formatTime(s.startTime);
                    const end = formatTime(s.endTime);
                    const task = `"${s.task?.replace(/"/g, '""').replace(/\n/g, ' ')}"`;
                    csv += `${date},${task},${start},${end},${dur}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `chronos-report-${Date.now()}.csv`;
                link.click();
            });

            document.getElementById('export-pdf').addEventListener('click', () => window.print());

            document.getElementById('export-json').addEventListener('click', () => {
                const dataStr = JSON.stringify(state, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `chronos-database-${Date.now()}.json`;
                link.click();
            });

            document.getElementById('import-json-btn').addEventListener('click', () => {
                document.getElementById('import-json-input').click();
            });

            document.getElementById('import-json-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const importedState = JSON.parse(event.target.result);
                        if (importedState.sessions && importedState.activeSession !== undefined) {
                            state = importedState;
                            saveState();
                            renderTracker();
                            renderReports();
                            alert("دیتابیس با موفقیت بازیابی شد!");
                        } else {
                            alert("فایل JSON نامعتبر است.");
                        }
                    } catch (err) {
                        alert("خطا در خواندن فایل: " + err.message);
                    }
                };
                reader.readAsText(file);
                e.target.value = ''; 
            });

            // --- Init ---
            loadState();
            renderTracker();
        });
    </script>
</body>
</html>
